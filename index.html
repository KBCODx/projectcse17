<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Wishlist Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Smart Wishlist</h1>
        
        <form id="item-form" class="input-section">
            <input type="text" id="item-input" placeholder="What do you want to get?..." required>
            
            <select id="category-select">
                <option value="Tech">💻 Tech</option>
                <option value="Groceries">🍎 Groceries</option>
                <option value="Clothes">👕 Clothes</option>
                <option value="Other">✨ Other</option>
            </select>
            
            <button type="submit" id="add-btn">Add Item</button>
        </form>

        <div class="filter-section">
            <label for="filter-select">Filter by Category:</label>
            <select id="filter-select">
                <option value="All">All Categories</option>
                <option value="Tech">💻 Tech</option>
                <option value="Groceries">🍎 Groceries</option>
                <option value="Clothes">👕 Clothes</option>
                <option value="Other">✨ Other</option>
            </select>
        </div>

        <ul id="wishlist" class="wishlist"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
